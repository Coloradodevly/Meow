name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK and CMake
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Bootstrap Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x ./gradlew

      - name: Clone ImGui
        run: |
          git clone --depth=1 https://github.com/ocornut/imgui.git /tmp/imgui
          DEST=app/src/main/jni/imgui
          mkdir -p $DEST/backends
          cp /tmp/imgui/imgui.h /tmp/imgui/imgui.cpp \
             /tmp/imgui/imgui_draw.cpp /tmp/imgui/imgui_tables.cpp \
             /tmp/imgui/imgui_widgets.cpp /tmp/imgui/imgui_internal.h \
             /tmp/imgui/imconfig.h /tmp/imgui/imstb_rectpack.h \
             /tmp/imgui/imstb_textedit.h /tmp/imgui/imstb_truetype.h \
             $DEST/
          cp /tmp/imgui/backends/imgui_impl_opengl3.h \
             /tmp/imgui/backends/imgui_impl_opengl3.cpp \
             /tmp/imgui/backends/imgui_impl_opengl3_loader.h \
             $DEST/backends/

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Find and upload libraries
        run: |
          find app/build -name "*.so" | grep arm64-v8a
          LOADER=$(find app/build -name "libLoader.so" -path "*/arm64-v8a/*" | head -1)
          MODMENU=$(find app/build -name "libModMenu.so" -path "*/arm64-v8a/*" | head -1)
          echo "Loader: $LOADER"
          echo "ModMenu: $MODMENU"
          cp "$LOADER" ~/libLoader.so
          cp "$MODMENU" ~/libModMenu.so

      - name: Upload libLoader.so
        uses: actions/upload-artifact@v4
        with:
          name: libLoader-so
          path: ~/libLoader.so
          retention-days: 7

      - name: Upload libModMenu.so
        uses: actions/upload-artifact@v4
        with:
          name: libModMenu-so
          path: ~/libModMenu.so
          retention-days: 7
