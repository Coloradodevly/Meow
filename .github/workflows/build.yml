name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK and CMake
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Bootstrap Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x ./gradlew

      - name: Clone ImGui
        run: |
          git clone --depth=1 https://github.com/ocornut/imgui.git /tmp/imgui
          DEST=app/src/main/jni/imgui
          mkdir -p $DEST/backends
          cp /tmp/imgui/imgui.h /tmp/imgui/imgui.cpp \
             /tmp/imgui/imgui_draw.cpp /tmp/imgui/imgui_tables.cpp \
             /tmp/imgui/imgui_widgets.cpp /tmp/imgui/imgui_internal.h \
             /tmp/imgui/imconfig.h /tmp/imgui/imstb_rectpack.h \
             /tmp/imgui/imstb_textedit.h /tmp/imgui/imstb_truetype.h \
             $DEST/
          cp /tmp/imgui/backends/imgui_impl_opengl3.h \
             /tmp/imgui/backends/imgui_impl_opengl3.cpp \
             /tmp/imgui/backends/imgui_impl_opengl3_loader.h \
             $DEST/backends/

      - name: Clone And64InlineHook
        run: |
          git clone --depth=1 https://github.com/Rprop/And64InlineHook.git /tmp/and64
          cp /tmp/and64/And64InlineHook.hpp app/src/main/jni/hooks/

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

     - name: Find and upload libmodmenu.so
        run: |
          find app/build -name "libmodmenu.so" | head -5
          SO=$(find app/build -name "libmodmenu.so" -path "*/arm64-v8a/*" | head -1)
          echo "Found .so at: $SO"
          cp $SO ~/libmodmenu.so

      - name: Upload libmodmenu.so
        uses: actions/upload-artifact@v5
        with:
          name: libmodmenu-so
          path: ~/libmodmenu.so
          retention-days: 7
