plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    ndkVersion "25.2.9519653" // Use NDK r25 or later

    defaultConfig {
        applicationId "com.modmenu"
        minSdk 21          // Android 5.0+
        targetSdk 34

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // Build for ARM64 only (targets your Poco M6 Pro 4G)
                // Add "armeabi-v7a" if you want 32-bit support too
                abiFilters "arm64-v8a"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
